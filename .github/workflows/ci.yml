name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: si_ci_admin
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: ci-admin-password-only
        ports: ['19532:5432']
        options: >-
          --health-cmd "pg_isready -U si_ci_admin -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SI_TEST_DB_PASSWORD: ci-test-password-only
      SI_EMULATOR_TEST_DB_PASSWORD: ci-emulator-test-password-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25.0.5'
      - run: >-
          docker exec ${{ job.services.postgres.id }} psql -U si_ci_admin -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE si_test LOGIN PASSWORD 'ci-test-password-only'"
          -c "CREATE ROLE si_emulator_test LOGIN PASSWORD 'ci-emulator-test-password-only'"
          -c "CREATE DATABASE si_test OWNER si_test"
          -c "CREATE DATABASE si_emulator_test OWNER si_emulator_test"
          -c "REVOKE CONNECT ON DATABASE si_test,si_emulator_test FROM PUBLIC"
      - run: sh ./gradlew --no-daemon --max-workers=2 check integrationTest bootJar :emulator:bootJar

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm test:api
