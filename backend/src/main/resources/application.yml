logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
server:
  port: ${SI_PORT:19580}
  address: ${SI_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SI_SECURE_COOKIE:false}
spring:
  application:
    name: system-integration
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${SI_DB_URL:jdbc:postgresql://127.0.0.1:19532/si_app}
    username: ${SI_DB_USER:si_app}
    password: ${SI_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 8
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
si:
  exchange:
    http:
      base-url: ${SI_EMULATOR_URL:http://127.0.0.1:19581}
      connect-timeout: 1s
      response-timeout: 2s
      max-response-size: 256KB
management:
  endpoints:
    web:
      exposure:
        include: health,exchange
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
