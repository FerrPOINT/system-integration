import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'org.springframework.boot'
    id 'org.openapi.generator'
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def internalApi = tasks.named('openApiGenerate', GenerateTask) {
    rootProject.configureContract(delegate, 'internal-api', 'internal')
}
def externalApi = tasks.register('generateExchangeApi', GenerateTask) {
    rootProject.configureContract(delegate, 'external-exchange', 'external')
}

sourceSets.main.java {
    srcDir(internalApi.flatMap { it.outputDir.dir('src/main/java') })
    srcDir(externalApi.flatMap { it.outputDir.dir('src/main/java') })
}

tasks.named('bootJar') { archiveFileName = 'system-integration.jar' }

tasks.register('integrationTest', Test) {
    description = 'HTTP and transaction tests against the isolated si_test PostgreSQL database'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres' }
    maxHeapSize = '384m'
    jvmArgs '-XX:ActiveProcessorCount=2'
    doFirst {
        if (!System.getenv('SI_TEST_DB_PASSWORD')) {
            throw new GradleException('SI_TEST_DB_PASSWORD is required; start the local PostgreSQL first')
        }
    }
}
