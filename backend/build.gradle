import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'org.openapi.generator' version '7.27.0'
}

group = 'com.azhukov.integration'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def configureContract = { GenerateTask task, String contract, String boundary ->
    def namespace = "com.azhukov.integration.contract.${boundary}"
    task.inputSpec.set(layout.projectDirectory.file("../contracts/${contract}.openapi.yaml"))
    task.outputDir.set(layout.buildDirectory.dir("generated/openapi/${boundary}"))
    task.generatorName.set('spring')
    task.library.set('spring-boot')
    task.apiPackage.set("${namespace}.api")
    task.modelPackage.set("${namespace}.model")
    task.validateSpec.set(true)
    task.cleanupOutput.set(true)
    task.globalProperties.set([
        apis: '', models: '',
        apiDocs: 'false', apiTests: 'false', modelDocs: 'false', modelTests: 'false'
    ])
    task.configOptions.set([
        interfaceOnly: 'true',
        skipDefaultInterface: 'true',
        useSpringBoot4: 'true',
        useTags: 'true',
        documentationProvider: 'none',
        annotationLibrary: 'none',
        openApiNullable: 'false',
        generateJsonIncludeAnnotations: 'true',
        generateJsonSetterNullsAnnotations: 'false',
        hideGenerationTimestamp: 'true'
    ])
}

def internalApi = tasks.named('openApiGenerate', GenerateTask) {
    configureContract(delegate, 'internal-api', 'internal')
}
def externalApi = tasks.register('generateExchangeApi', GenerateTask) {
    configureContract(delegate, 'external-exchange', 'external')
}

sourceSets.main.java {
    srcDir(internalApi.flatMap { it.outputDir.dir('src/main/java') })
    srcDir(externalApi.flatMap { it.outputDir.dir('src/main/java') })
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'postgres' }
}

tasks.named('bootJar') { archiveFileName = 'system-integration.jar' }

tasks.register('integrationTest', Test) {
    description = 'HTTP and transaction tests against the isolated si_test PostgreSQL database'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres' }
    maxHeapSize = '384m'
    jvmArgs '-XX:ActiveProcessorCount=2'
    doFirst {
        if (!System.getenv('SI_TEST_DB_PASSWORD')) {
            throw new GradleException('SI_TEST_DB_PASSWORD is required; start the local PostgreSQL first')
        }
    }
}
