limit_req_zone $binary_remote_addr zone=integration_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name demo.azhukov-dev.ru;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://demo.azhukov-dev.ru$request_uri; }
}

# Existing Xray TLS termination sends the original peer with PROXY protocol.
server {
    listen 127.0.0.1:8080 proxy_protocol;
    server_name demo.azhukov-dev.ru;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    location ~ /\.(?!well-known/) { return 404; }
    location = /api/login {
        limit_req zone=integration_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:19573;
    }
    location / { proxy_pass http://127.0.0.1:19573; }
}
