server:
  address: ${SI_EMULATOR_ADDRESS:127.0.0.1}
  port: ${SI_EMULATOR_PORT:19581}
spring:
  application:
    name: system-integration-emulator
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${SI_EMULATOR_DB_URL:jdbc:postgresql://127.0.0.1:19532/si_emulator}
    username: ${SI_EMULATOR_DB_USER:si_emulator}
    password: ${SI_EMULATOR_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      maximum-pool-size: 4
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
si:
  emulator:
    publication-batch-size: ${SI_EMULATOR_PUBLICATION_BATCH_SIZE:25}
